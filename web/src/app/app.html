<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/" aria-label="MASSEQ · Flota de maquinaria – ir al inicio">
      <img class="brand__logo" src="brand/logo-masseq-teq-dark.png" alt="" width="339" height="146" />
      <span class="brand__text">Flota de maquinaria</span>
    </a>
    <a mat-flat-button class="add-btn" routerLink="/maquinaria/nueva" aria-label="Agregar equipo">
      <mat-icon>add</mat-icon>
      <span class="add-btn__label">Agregar equipo</span>
    </a>
  </div>
</header>
<div class="accent-line" aria-hidden="true"></div>

@if (machines.slow()) {
  <div class="slow-banner" role="status" aria-live="polite">
    <mat-spinner diameter="18" strokeWidth="3" />
    <span>Conectando con el servidor, puede tardar hasta un minuto…</span>
  </div>
}

<main class="content">
  <router-outlet />
</main>

<footer class="footer">
  <p class="footer__brand">MASSEQ <span class="footer__sep" aria-hidden="true">|</span> CONSTRUIMOS CONFIANZA</p>
  <p>Desarrollado por Juan Eduardo Díaz Martínez</p>
  <p class="footer__note">Prueba técnica MASSEQ · {{ year }} · Datos de ejemplo</p>
</footer>
